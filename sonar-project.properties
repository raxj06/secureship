# SonarCloud — update sonar.projectKey / organization after creating project
sonar.projectKey=secureship
sonar.organization=secureship
sonar.sources=services
sonar.exclusions=**/node_modules/**,**/dist/**,**/tests/**,**/*.test.ts,**/prisma/**
sonar.javascript.lcov.reportPaths=services/*/coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.base.json
