name: Release

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, order-service, tracking-service, notification-service]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/secureship-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/secureship/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v5
        with:
          ref: deploy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        run: |
          SHA="${{ github.sha }}"
          FILE="environments/dev/values.yaml"
          # Replace tag: <anything> with tag: <sha> for all services
          sed -i "s/tag: .*/tag: ${SHA}/g" "$FILE"
          cat "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add environments/dev/values.yaml
          git commit -m "chore: deploy dev ${SHORT} (${SHA})"
          git push origin deploy
